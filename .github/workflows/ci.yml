name: Build and Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build, test, and package extension
        run: xvfb-run -a npm run build

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: guide-vsc-vsix
          path: dist/guide-vsc.vsix
          if-no-files-found: error
